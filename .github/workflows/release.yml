# Linux release binary on tag push:  git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cp target/release/qmk-autolayer qmk-autolayer-x86_64-unknown-linux-gnu
      - uses: softprops/action-gh-release@v2
        with:
          files: qmk-autolayer-x86_64-unknown-linux-gnu
